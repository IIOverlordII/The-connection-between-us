# Builds "Between Us.exe" on a Windows runner with the same script used locally.
# Every push: the .exe is attached to the run as an artifact. Push to main: also published as the latest release,
# so .../releases/latest/download/BetweenUs.exe always points to the newest build.
name: Between Us.exe

on:
  push:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'tools/**'
      - 'test/**'
      - '.github/workflows/exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: node --test test/engine.test.js test/game.test.js test/i18n.test.js

      - name: Сборка .exe (desktop\build_exe.ps1)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop\build_exe.ps1

      - name: Проверка
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'exe не найден' }
          "{0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          Copy-Item $exe.FullName BetweenUs.exe

      - name: Сохранить .exe
        uses: actions/upload-artifact@v4
        with:
          name: BetweenUs-windows
          path: BetweenUs.exe
          retention-days: 30

      # asset names must be ASCII without spaces: the file is uploaded as BetweenUs.exe
      - name: Выложить в релиз
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create windows-latest "BetweenUs.exe#Between Us for Windows" \
            --target "$GITHUB_SHA" --latest \
            --title "Between Us for Windows" \
            --notes "Latest build from main (${GITHUB_SHA::7}). Download BetweenUs.exe and run it — no installation or internet needed. If Windows shows \"Windows protected your PC\", click \"More info\" → \"Run anyway\": the file is not code-signed."
